<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA Marketplace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <h1>🏪 UTA Marketplace</h1>
                <div class="architecture-toggle">
                    <label>
                        <input type="radio" name="architecture" value="microservices" checked>
                        Microservices (8080)
                    </label>
                    <label>
                        <input type="radio" name="architecture" value="monolithic">
                        Monolithic (9000)
                    </label>
                </div>
                <div class="user-section" id="userSection" style="display: none;">
                    <span id="userName"></span>
                    <button onclick="logout()" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </header>

        <!-- Login Section -->
        <section id="loginSection" class="card">
            <h2>Login</h2>
            <form id="loginForm" onsubmit="login(event)">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="loginEmail" value="alice@uta.edu" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="loginPassword" value="password123" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <p class="helper-text">Sample users: alice@uta.edu, bob@uta.edu, carol@uta.edu (password: password123)</p>
        </section>

        <!-- Main Content -->
        <div id="mainContent" style="display: none;">
            <!-- Search Section -->
            <section class="card">
                <h2>🔍 Search Listings</h2>
                <div class="search-controls">
                    <input type="text" id="searchQuery" placeholder="Search for items..." class="search-input">
                    <select id="categoryFilter" class="filter-select">
                        <option value="">All Categories</option>
                    </select>
                    <button onclick="searchListings()" class="btn btn-primary">Search</button>
                </div>
                <div id="searchResults" class="listings-grid"></div>
            </section>

            <!-- User Profile -->
            <section class="card">
                <h2>👤 My Profile</h2>
                <div id="profileInfo"></div>
            </section>

            <!-- Favorites -->
            <section class="card">
                <h2>⭐ My Favorites</h2>
                <div id="favoritesContent" class="listings-grid"></div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

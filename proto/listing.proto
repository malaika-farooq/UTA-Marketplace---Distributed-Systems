syntax = "proto3";

package listing;

service ListingService {
  rpc CreateListing(CreateListingRequest) returns (CreateListingResponse);
  rpc GetListing(GetListingRequest) returns (GetListingResponse);
  rpc UpdateListing(UpdateListingRequest) returns (UpdateListingResponse);
  rpc DeleteListing(DeleteListingRequest) returns (DeleteListingResponse);
  rpc GetUserListings(GetUserListingsRequest) returns (GetUserListingsResponse);
  rpc GetAllListings(GetAllListingsRequest) returns (GetAllListingsResponse);
}

message Listing {
  string id = 1;
  string title = 2;
  string description = 3;
  double price = 4;
  string category_id = 5;
  string condition_id = 6;
  string seller_id = 7;
  string seller_email = 8;
  string seller_whatsapp = 9;
  string image_url = 10;
  string meet_spot_id = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
  bool is_active = 14;
}

message CreateListingRequest {
  string user_id = 1;
  string title = 2;
  string description = 3;
  double price = 4;
  string category_id = 5;
  string condition_id = 6;
  string seller_email = 7;
  string seller_whatsapp = 8;
  string image_url = 9;
  string meet_spot_id = 10;
}

message CreateListingResponse {
  bool success = 1;
  string message = 2;
  Listing listing = 3;
}

message GetListingRequest {
  string listing_id = 1;
}

message GetListingResponse {
  bool success = 1;
  string message = 2;
  Listing listing = 3;
}

message UpdateListingRequest {
  string listing_id = 1;
  string user_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional double price = 5;
  optional string category_id = 6;
  optional string condition_id = 7;
  optional string image_url = 8;
  optional string meet_spot_id = 9;
  optional bool is_active = 10;
}

message UpdateListingResponse {
  bool success = 1;
  string message = 2;
  Listing listing = 3;
}

message DeleteListingRequest {
  string listing_id = 1;
  string user_id = 2;
}

message DeleteListingResponse {
  bool success = 1;
  string message = 2;
}

message GetUserListingsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetUserListingsResponse {
  bool success = 1;
  repeated Listing listings = 2;
  int32 total_count = 3;
}

message GetAllListingsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetAllListingsResponse {
  bool success = 1;
  repeated Listing listings = 2;
  int32 total_count = 3;
}
